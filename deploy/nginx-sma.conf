# Reverse proxy for SMA. Copy to /etc/nginx/sites-available/sma and symlink
# into sites-enabled. The WebSocket upgrade map lives in ws-upgrade.conf
# (dropped into /etc/nginx/conf.d/ so it sits in the http context).
server {
    listen 80;
    listen [::]:80;
    server_name s.sma.et 169.58.25.114;

    # Allow base64 image data URIs through (messages can carry images).
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket upgrade for /ws
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # So adapter-node can reconstruct the real origin + client IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_read_timeout 3600s; # keep idle websockets alive
    }
}
